name: test job
on:
  workflow_call:
    inputs:
      python-version:
        type: string
      test-file:
        type: string
    outputs:
      Number_of_Rows: 
        value: ${{jobs.test.outputs.rows}}
      Test_Status: 
        value: ${{jobs.test.outputs.result}}
jobs:
  test:
    outputs:
      rows: ${{ steps.count.outputs.rows}}
      result: ${{steps.run_test.outcome}}
    runs-on: ubuntu-latest 
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: cashing requierments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{hashFiles('requirements.txt')}}
      - name: print python version 
        run: echo "python version is ${{inputs.python-version}}"
      - name: install Python 
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version}}  
      - name: install reiquirments
        run: pip install -r requirements.txt
      - name: run test data quality 
        id: run_test
        run: pytest ${{ inputs.test-file}} -v 
      - name: count of rows
        id: count
        run: |
          ROW=$(wc -l < data/raw_sales.csv)
          echo "rows=$ROW" >> $GITHUB_OUTPUT
  dummy:
    runs-on: ubuntu-latest
    steps:
      - name: print something
        run: echo "something"